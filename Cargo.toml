[workspace]
resolver = "3"
members = [
    "crates/*",
    # "apps/*",
    # "benchmarks",
    # "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"

[profile.bench]
inherits = "release"
debug = 1
