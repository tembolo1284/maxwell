[package]
name = "maxwell-replay"
version = "0.1.0"
edition = "2024"
description = "Persistent market data journaling and deterministic replay for Maxwell"
publish = false

[lib]
name = "maxwell_replay"
path = "src/lib.rs"

[dependencies]
maxwell-core = { path = "../../crates/maxwell-core" }
maxwell-protocol = { path = "../../crates/maxwell-protocol" }

[dev-dependencies]
maxwell-server = { path = "../maxwell-server" }
maxwell-simulator = { path = "../maxwell-simulator" }
